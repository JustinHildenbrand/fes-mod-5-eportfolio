<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Justin Hildenbrand - E-Portfolio</title>
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/5db0adc531.js"
      crossorigin="anonymous"
    ></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <section id="landing-page">
      <nav>
        <figure>
          <img id="logo" src="./assets/logo.jpg" alt="Logo" />
        </figure>
        <ul class="nav__link--list">
          <li class="nav__link">
            <a
              href="#about"
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              >About</a
            >
          </li>
          <li class="nav__link">
            <a
              href="#projects"
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              >Projects</a
            >
          </li>
          <li class="nav__link">
            <a
              href="#contact"
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              >Contact</a
            >
          </li>
          <li class="nav__link click-effect">
            <a
              href="#"
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              ><i class="fa-solid fa-circle-half-stroke"></i
            ></a>
          </li>
        </ul>
      </nav>
      <header class="header">
        <div class="header__content">
          <h1 class="title">Hey</h1>
          <h1 class="title text__emphasis text__color--dkseagreen">
            I'm Justin
          </h1>
          <p class="header__para">
            Ich bin eine
            <span class="text__color--dkseagreen text__emphasis"
              >Software Developer</span
            >
            <br />
            Here's a little more
            <span class="text__color--dkseagreen text__emphasis"
              >about me.</span
            >
            lorem ipsum dolor sit amet, consectetur adipiscing elit. Donec
            convallis, nisl eget convallis tincidunt, nunc nisl aliquam nunc, eu
          </p>
          <ul class="social__list">
            <li class="social__icon click-effect">
              <a
                href="https://github.com"
                target="_blank"
                rel="noopener noreferrer"
              >
                <i class="fa-brands fa-square-github"></i>
              </a>
            </li>
            <li class="social__icon click-effect">
              <a
                href="https://linkedin.com"
                target="_blank"
                rel="noopener noreferrer"
              >
                <i class="fa-brands fa-square-linkedin"></i>
              </a>
            </li>
            <li class="social__icon click-effect">
              <a href="#" target="_blank" rel="noopener noreferrer">
                <i class="fa-solid fa-file-pdf" font-size="40px"></i>
              </a>
            </li>
          </ul>
        </div>
      </header>
      <button class="mail__btn click-effect">
        <i class="fa-solid fa-envelope"></i>
      </button>
      <a href="#projects" class="scroll">
        <div class="scroll__icon click-effect"></div>
      </a>
    </section>
  </body>
</html>
